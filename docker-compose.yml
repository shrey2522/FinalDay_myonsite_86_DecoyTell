services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decoytell
      POSTGRES_PASSWORD: decoytell
      POSTGRES_DB: decoytell
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoytell"]
      interval: 2s
      timeout: 2s
      retries: 30

  real-asset:
    build:
      context: ./containers/identity
      args:
        ACCOUNT_AGE_DAYS: 800
    environment:
      BANNER: "Apache/2.4.54 (Debian)"
      TIMING_MS: "0"
      MONITORING: immediate
    ports:
      - "8443:8443"

  decoy:
    build:
      context: ./containers/identity
      args:
        ACCOUNT_AGE_DAYS: 800
    environment:
      BANNER: "Apache/2.4.55 (Debian)"
      TIMING_MS: "1500"
      MONITORING: immediate
    ports:
      - "8444:8443"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DECOYTELL_DSN: postgres://decoytell:decoytell@postgres:5432/decoytell
      DECOYTELL_REAL_HOST: real-asset
      DECOYTELL_REAL_PORT: "8443"
      DECOYTELL_DECOY_HOST: decoy
      DECOYTELL_DECOY_PORT: "8443"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - real-asset
      - decoy

volumes:
  pgdata: