services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decoytell
      POSTGRES_PASSWORD: decoytell
      POSTGRES_DB: decoytell
    # NOTE: bound to all host interfaces (not 127.0.0.1) on purpose:
    # Docker Desktop's loopback-only forward (127.0.0.1:5433) adds ~10s
    # latency per connection on this WSL2 setup, breaking host tooling.
    # Postgres remains protected by its own credentials + the control token.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoytell"]
      interval: 2s
      timeout: 2s
      retries: 30

  real-asset:
    build:
      context: ./containers/identity
      args:
        ACCOUNT_AGE_DAYS: 800
        CERT_CN: www.example.com
    environment:
      BANNER: "Apache/2.4.54 (Debian)"
      TIMING_MS: "0"
      MONITORING: immediate
      CERT_CN: www.example.com
      DECOYTELL_CONTROL_TOKEN: ${DECOYTELL_CONTROL_TOKEN:?set DECOYTELL_CONTROL_TOKEN in .env}
    ports:
      - "8443:8443"

  decoy:
    build:
      context: ./containers/identity
      args:
        ACCOUNT_AGE_DAYS: 800
        CERT_CN: legacy.example.com
    environment:
      BANNER: "Apache/2.4.29 (Debian)"
      TIMING_MS: "1500"
      MONITORING: immediate
      CERT_CN: legacy.example.com
      DECOYTELL_CONTROL_TOKEN: ${DECOYTELL_CONTROL_TOKEN:?set DECOYTELL_CONTROL_TOKEN in .env}
    ports:
      - "8444:8443"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DECOYTELL_DSN: postgres://decoytell:decoytell@postgres:5432/decoytell
      DECOYTELL_REAL_HOST: real-asset
      DECOYTELL_REAL_PORT: "8443"
      DECOYTELL_DECOY_HOST: decoy
      DECOYTELL_DECOY_PORT: "8443"
      DECOYTELL_CONTROL_TOKEN: ${DECOYTELL_CONTROL_TOKEN:?set DECOYTELL_CONTROL_TOKEN in .env}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - real-asset
      - decoy

  loop:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "loop_service.py", "--interval", "5"]
    environment:
      DECOYTELL_DSN: postgres://decoytell:decoytell@postgres:5432/decoytell
      DECOYTELL_REAL_HOST: real-asset
      DECOYTELL_REAL_PORT: "8443"
      DECOYTELL_DECOY_HOST: decoy
      DECOYTELL_DECOY_PORT: "8443"
      DECOYTELL_CONTROL_TOKEN: ${DECOYTELL_CONTROL_TOKEN:?set DECOYTELL_CONTROL_TOKEN in .env}
    depends_on:
      - postgres
      - real-asset
      - decoy
    restart: unless-stopped

volumes:
  pgdata: